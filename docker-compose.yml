networks:
  cowrie_local:
  dionaea_local:
  nginx_local:
  ewsposter_local:

services:

#########################################
#### T-Pot Init - Necessário para o sistema
#########################################
  tpotinit:
    container_name: tpotinit
    env_file:
      - .env
    restart: always
    stop_grace_period: 60s
    tmpfs:
      - /tmp/etc:uid=2000,gid=2000
      - /tmp/:uid=2000,gid=2000
    network_mode: "host"
    cap_add:
     - NET_ADMIN
    image: ${TPOT_REPO}/tpotinit:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
      - ${TPOT_DOCKER_COMPOSE}:/tmp/tpot/docker-compose.yml:ro
      - ${TPOT_DATA_PATH}/blackhole:/etc/blackhole
      - ${TPOT_DATA_PATH}:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

##################
#### Honeypots
##################

# Cowrie service (SSH/Telnet)
  cowrie:
    container_name: cowrie
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    tmpfs:
      - /tmp/cowrie:uid=2000,gid=2000
      - /tmp/cowrie/data:uid=2000,gid=2000
    networks:
      - cowrie_local
    ports:
      - "22:22"
      - "23:23"
    image: ${TPOT_REPO}/cowrie:${TPOT_VERSION} 
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/cowrie/downloads:/home/cowrie/cowrie/dl
      - ${TPOT_DATA_PATH}/cowrie/keys:/home/cowrie/cowrie/etc
      - ${TPOT_DATA_PATH}/cowrie/log:/home/cowrie/cowrie/log
      - ${TPOT_DATA_PATH}/cowrie/log/tty:/home/cowrie/cowrie/log/tty

# Dionaea service (captura de malware — SMB/FTP/MSSQL/MQTT/TFTP/...)
# Config de portas/volumes segue o padrão conhecido do T-Pot CE para o Dionaea;
# ajuste se divergir da imagem publicada em ${TPOT_REPO}/dionaea.
  dionaea:
    container_name: dionaea
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    tmpfs:
      - /tmp/dionaea:uid=2000,gid=2000
    cap_add:
      - NET_ADMIN
    networks:
      - dionaea_local
    ports:
      - "21:21"          # FTP
      - "42:42"           # WINS
      - "69:69/udp"       # TFTP
      - "135:135"         # MSRPC
      - "443:443"         # HTTPS
      - "445:445"         # SMB
      - "1433:1433"       # MSSQL
      - "1723:1723"       # PPTP
      - "1883:1883"       # MQTT
      - "3306:3306"       # MySQL
      - "5060:5060"       # SIP (TCP)
      - "5060:5060/udp"   # SIP (UDP)
      - "27017:27017"     # MongoDB
    image: ${TPOT_REPO}/dionaea:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/dionaea/roots/ftp:/opt/dionaea/var/dionaea/roots/ftp
      - ${TPOT_DATA_PATH}/dionaea/roots/tftp:/opt/dionaea/var/dionaea/roots/tftp
      - ${TPOT_DATA_PATH}/dionaea/roots/www:/opt/dionaea/var/dionaea/roots/www
      - ${TPOT_DATA_PATH}/dionaea/roots/upload:/opt/dionaea/var/dionaea/roots/upload
      - ${TPOT_DATA_PATH}/dionaea/binaries:/opt/dionaea/var/dionaea/binaries
      - ${TPOT_DATA_PATH}/dionaea/log:/opt/dionaea/var/log
      - ${TPOT_DATA_PATH}/dionaea/rtp:/opt/dionaea/var/dionaea/rtp

##################
#### Ferramentas de Log (Opcional, mas recomendado para ver os ataques)
##################

# Nginx (Para acessar a interface se você for usar o ElasticSearch depois)
# Também serve como proxy reverso autenticado do dashboard/API do BeeIA na
# porta 64298 — ver docker/nginx/dist/conf/beeia.conf e
# md-usotcc/proteger-dashboard.md antes de expor o backend publicamente.
  nginx:
    container_name: nginx
    restart: always
    environment:
      - TPOT_OSTYPE=${TPOT_OSTYPE}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # permite alcançar o backend do BeeIA rodando no host
    depends_on:
      tpotinit:
        condition: service_healthy
    tmpfs:
      - /var/tmp/nginx/client_body
      - /var/tmp/nginx/proxy
      - /var/tmp/nginx/fastcgi
      - /var/tmp/nginx/uwsgi
      - /var/tmp/nginx/scgi
      - /run
      - /var/lib/nginx/tmp:uid=100,gid=82
    networks:
      - nginx_local
    ports:
      - "64297:64297"
      - "64294:64294"
      - "64298:64298"   # BeeIA — dashboard + API atrás de Basic Auth
    image: ${TPOT_REPO}/nginx:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/nginx/cert/:/etc/nginx/cert/:ro
      - ${TPOT_DATA_PATH}/nginx/conf/nginxpasswd:/etc/nginx/nginxpasswd:ro
      - ${TPOT_DATA_PATH}/nginx/conf/lswebpasswd:/etc/nginx/lswebpasswd:ro
      - ${TPOT_DATA_PATH}/nginx/log/:/var/log/nginx/
      - ./docker/nginx/dist/conf/beeia.conf:/etc/nginx/conf.d/beeia.conf:ro
      - ./frontend/dist:/var/lib/nginx/html/beeia:ro