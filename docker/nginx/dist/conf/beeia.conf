####################################################################
### BeeIA — dashboard + API atrás de Basic Auth (nginx do T-Pot) ###
####################################################################
#
# IMPORTANTE: o serviço `nginx` do docker-compose.yml usa a imagem PRONTA
# ${TPOT_REPO}/nginx:${TPOT_VERSION} (não builda docker/nginx/Dockerfile
# localmente). Por isso este arquivo é montado como VOLUME em tempo de
# execução — não precisa (nem faz efeito) rebuildar a imagem. Ver o mount
# correspondente no serviço `nginx` do docker-compose.yml.
#
# Pré-requisitos antes de usar:
#   1. WEB_USER configurado no .env e as credenciais geradas em
#      data/nginx/conf/nginxpasswd (ver md-usotcc/rodar-cowrie.md) — são as
#      MESMAS credenciais reaproveitadas aqui via auth_basic_user_file.
#   2. Frontend buildado: `cd frontend && npm run build` (gera frontend/dist,
#      montado como volume read-only pelo docker-compose.yml).
#   3. Backend do BeeIA rodando e acessível a partir do container nginx.
#      Por padrão assume-se que o backend roda no MESMO host que o Docker
#      (resolve via `host.docker.internal`, mapeado no docker-compose.yml).
#      Se o backend estiver em outra máquina/VM, troque o valor de
#      `proxy_pass` abaixo pelo IP real — ver md-usotcc/proteger-dashboard.md.
#   4. BEEIA_API_KEY definida no .env do backend E no frontend/.env
#      (VITE_API_KEY, mesmo valor) — Basic Auth aqui protege o acesso à
#      página; a API key é uma segunda camada, verificada pelo backend.
#
# Acesso: https://<host>:64298/  (porta configurável — ver docker-compose.yml)

server {
    listen 64298 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/cert/nginx.crt;
    ssl_certificate_key /etc/nginx/cert/nginx.key;
    ssl_protocols TLSv1.3;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH:!DHE:!SHA:!SHA256';
    ssl_prefer_server_ciphers on;

    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains;";

    client_max_body_size 2M;
    client_body_timeout   10;
    client_header_timeout 10;

    # Basic Auth — reaproveita as credenciais WEB_USER já usadas no restante do T-Pot.
    satisfy any;
    allow 127.0.0.1;
    allow ::1;
    deny  all;
    auth_basic           "BeeIA — acesso restrito";
    auth_basic_user_file /etc/nginx/nginxpasswd;

    # Dashboard (arquivos estáticos do build do Vite)
    root /var/lib/nginx/html/beeia;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST — repassa para o backend FastAPI. Ajuste o host se o backend
    # não estiver na mesma máquina que o Docker.
    location /api/ {
        proxy_pass http://host.docker.internal:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — eventos em tempo real
    location /ws {
        proxy_pass http://host.docker.internal:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }
}
